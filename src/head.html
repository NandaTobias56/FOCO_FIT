<title>Foco Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: mundo de jogo noturno. Cena do avatar no topo, missões em cartões brilhantes, barra de abas flutuante embaixo. Tema único escuro, escolhido de propósito. */
:root{
  --bg:#130A26; --bg-2:#1B0F36;
  --card:#22164A; --card-2:#2E1F5E; --line:#43307F;
  --ink:#FFF5FF; --muted:#BBA9E0; --dim:#8676B3;
  --pink:#FF4F9A; --pink-2:#C9246D;
  --orange:#FF9A3C; --yellow:#FFD84A; --cyan:#3CDCF7; --green:#3DE38D; --red:#FF6464; --violet:#9C6BFF;
  --skin1:#F6D4B7; --skin2:#DDA77F; --skin3:#AC6D46; --skin4:#70442A;
  --f-game:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:only dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;font-weight:600;
  background-image:radial-gradient(120% 60% at 10% -10%,rgba(156,107,255,.35),transparent 60%),radial-gradient(90% 50% at 110% 10%,rgba(255,79,154,.25),transparent 60%);background-attachment:fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-game);font-weight:400;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(110px + env(safe-area-inset-bottom,0px))}

/* barra de status do jogo */
.hud{display:flex;align-items:center;gap:10px}
.lv{position:relative;width:52px;height:56px;flex:none;display:grid;place-items:center;font-family:var(--f-game);font-size:22px;color:#2a1450}
.lv svg{position:absolute;inset:0;width:100%;height:100%}
.lv span{position:relative;line-height:1}
.lv small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9px;font-family:var(--f-body);font-weight:900;background:var(--ink);color:var(--bg);padding:1px 5px;border-radius:6px;letter-spacing:.05em}
.hud .mid{flex:1;min-width:0;display:grid;gap:4px}
.hud .name{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hud .name b{font-family:var(--f-game);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .name span{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.xpbar{height:14px;border-radius:99px;background:#0d0620;border:2px solid var(--line);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow));border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.xpbar i::after{content:"";position:absolute;inset:2px 6px auto;height:3px;border-radius:9px;background:rgba(255,255,255,.45)}
.flame{display:grid;justify-items:center;flex:none;min-width:50px}
.flame svg{width:30px;height:34px;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 100%}
.flame b{font-family:var(--f-game);font-size:18px;line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}
.flame.off svg{filter:grayscale(1);opacity:.5;animation:none}
.flame.off b{color:var(--dim)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08,1.12) rotate(2deg)}}

/* cena do avatar */
.scene{position:relative;margin-top:12px;border-radius:28px;overflow:hidden;height:250px;border:2px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.scene .av{position:absolute;left:63%;bottom:6px;width:180px;height:210px;transform:translateX(-50%)}
.scene .av svg{width:100%;height:100%;overflow:visible}
.scene .ring{position:absolute;right:12px;top:12px;width:72px;height:72px}
.scene .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-game);font-size:18px;line-height:1;text-align:center}
.scene .ring b small{display:block;font-family:var(--f-body);font-size:9px;font-weight:900;letter-spacing:.06em;color:var(--ink);opacity:.85}
.scene .stage-tag{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.bubble{position:absolute;left:12px;top:44px;max-width:40%;background:var(--ink);color:#2a1450;padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:13px;font-weight:800;line-height:1.25;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:bub .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bub{from{transform:scale(.6);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.015)}}
.jump .bob{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1.05,.92)}35%{transform:translateY(-34px) scale(.96,1.06)}70%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.tiredav .bob{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(2px)}}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.shadow{animation:shad 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shad{50%{transform:scaleX(.9)}}

/* fundos */
.bg-noite{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.7) 1px,transparent 2px),radial-gradient(circle at 70% 18%,rgba(255,255,255,.6) 1px,transparent 2px),radial-gradient(circle at 85% 55%,rgba(255,255,255,.5) 1px,transparent 2px),radial-gradient(circle at 40% 12%,rgba(255,255,255,.5) 1px,transparent 2px),linear-gradient(180deg,#3B1E7A 0%,#5A2A9E 55%,#2B1660 56%,#22124F 100%)}
.bg-academia{background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 46px) bottom/100% 30% no-repeat,linear-gradient(180deg,#FF7A45 0%,#E2456B 58%,#4A2558 58.5%,#381C46 100%)}
.bg-praia{background:radial-gradient(circle at 78% 26%,#FFF3B0 0 22px,transparent 24px),linear-gradient(180deg,#46C7F2 0%,#9FE6F7 50%,#2AA6D6 50.5%,#2AA6D6 62%,#F7D79A 62.5%,#E8BF73 100%)}
.bg-por{background:radial-gradient(circle at 50% 62%,#FFE07A 0 34px,rgba(255,170,80,.6) 36px,transparent 80px),linear-gradient(180deg,#5B2A86 0%,#E2457A 45%,#FF9F4A 62%,#3A1747 62.5%,#2A1036 100%)}
.bg-espaco{background:radial-gradient(circle at 22% 70%,#B68CFF 0 18px,transparent 19px),radial-gradient(circle at 15% 20%,#fff 1px,transparent 2px),radial-gradient(circle at 60% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 88% 12%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 75% 70%,#fff 1px,transparent 2px),radial-gradient(120% 80% at 50% 120%,#3A1A8A,transparent),#0C0A2A}
.bg-floresta{background:radial-gradient(60% 30% at 15% 62%,#2E8B57 0 99%,transparent),radial-gradient(60% 34% at 85% 60%,#2A7D50 0 99%,transparent),linear-gradient(180deg,#9BE7C4 0%,#5CC6A0 52%,#1F6B45 58%,#174F34 100%)}

/* cartões */
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec h2{font-size:21px}
.sec small{font-size:12px;color:var(--muted);font-weight:800}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:2px solid var(--line);border-radius:22px;padding:14px}
.stack{display:grid;gap:10px}

/* AGORA */
.now{position:relative;margin-top:14px;border-radius:24px;padding:16px;background:linear-gradient(135deg,var(--pink) 0%,var(--orange) 100%);box-shadow:0 10px 30px rgba(255,79,154,.35);overflow:hidden;display:grid;gap:10px}
.now::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.now .k{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:6px}
.now .k i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.now h3{font-size:24px;position:relative}
.now p{margin:0;font-size:13px;font-weight:700;opacity:.95;position:relative}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.now.done{background:linear-gradient(135deg,#1FB872,#3CDCF7);box-shadow:0 10px 30px rgba(61,227,141,.3)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:10px 16px;font-weight:900;font-size:14px;background:var(--card-2);border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.big{padding:13px 20px;font-size:16px;border-radius:16px}
.btn.white{background:#fff;color:#2a1450;border-color:#fff}
.btn.glass{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.btn.pink{background:var(--pink);border-color:var(--pink)}
.btn.green{background:var(--green);border-color:var(--green);color:#0b3a22}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#06303a}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#3a2a00}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.full{width:100%}

/* promessa */
.promise{border-color:var(--yellow);background:linear-gradient(180deg,#3A2A63,#271A4E)}
.promise h3{font-size:19px;color:var(--yellow)}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.popts button{border-radius:14px;padding:10px;text-align:left;background:rgba(255,255,255,.06);border:2px solid var(--line);font-size:13px;font-weight:800;line-height:1.2}
.popts button.on{border-color:var(--yellow);background:rgba(255,216,74,.14)}
.hold{position:relative;overflow:hidden;width:100%;border-radius:16px;padding:14px;font-family:var(--f-game);font-size:18px;background:var(--yellow);color:#3a2a00;box-shadow:0 4px 0 #A8840F;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0 100% 0 0;background:rgba(255,255,255,.55);transition:right 0s}
.hold.go i{right:0;transition:right 1.1s linear}
.hold span{position:relative}
.promise-on{display:flex;gap:12px;align-items:center}
.promise-on .seal{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#3a2a00;font-family:var(--f-game);font-size:20px}
.promise-on.ok .seal{background:var(--green);color:#0b3a22}
.promise-on b{display:block;font-family:var(--f-game);font-size:17px;font-weight:400}
.promise-on span{font-size:12px;color:var(--muted)}

/* missões */
.q{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.04);border:2px solid transparent;transition:background .2s,border-color .2s}
.q+.q{margin-top:8px}
.q.done{background:rgba(61,227,141,.10);border-color:rgba(61,227,141,.35)}
.q.mod{background:rgba(255,154,60,.10);border-color:rgba(255,154,60,.35)}
.q.bad{background:rgba(255,100,100,.10);border-color:rgba(255,100,100,.3)}
.q.skip{opacity:.6}
.chk{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:#0d0620;transition:transform .15s}
.chk:active{transform:scale(.88)}
.chk svg{width:24px;height:24px;opacity:.25}
.q.done .chk{background:var(--green);border-color:var(--green)}
.q.mod .chk{background:var(--orange);border-color:var(--orange)}
.q.bad .chk{background:var(--red);border-color:var(--red)}
.q.done .chk svg,.q.mod .chk svg,.q.bad .chk svg{opacity:1;animation:pop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{from{transform:scale(0)}}
.q .t{flex:1;min-width:0}
.q .t .h{display:flex;gap:8px;align-items:baseline}
.q .t .h em{font-style:normal;font-size:12px;color:var(--pink);font-weight:900;font-variant-numeric:tabular-nums}
.q .t b{font-family:var(--f-game);font-weight:400;font-size:17px;display:block;line-height:1.1}
.q .t p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.q .t p.res{color:var(--ink)}
.q .side{display:grid;gap:4px;justify-items:end}
.xp{font-family:var(--f-game);color:var(--yellow);font-size:14px;white-space:nowrap}
.mini{font-size:12px;font-weight:900;color:var(--muted);padding:4px 8px;border-radius:9px;background:rgba(255,255,255,.07)}
.mini.swap{color:var(--cyan)}

.ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center}
.ic svg{width:26px;height:26px}
.ic.gym{background:rgba(255,79,154,.18);color:var(--pink)}
.ic.run{background:rgba(60,220,247,.16);color:var(--cyan)}

/* água */
.water{display:flex;align-items:center;gap:14px}
.bottle{position:relative;width:74px;height:120px;flex:none}
.bottle svg{width:100%;height:100%}
.water .t{flex:1;min-width:0;display:grid;gap:8px}
.water .t b{font-family:var(--f-game);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.water .t b small{font-size:15px;color:var(--muted)}
.drops{display:flex;gap:4px;flex-wrap:wrap}
.drops i{width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#0d0620;border:2px solid var(--cyan)}
.drops i.on{background:var(--cyan)}

/* baú */
.chest{display:flex;gap:14px;align-items:center}
.chest .box{width:84px;height:76px;flex:none}
.chest .box svg{width:100%;height:100%}
.chest.ready .box{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.chest .t{flex:1;min-width:0;display:grid;gap:6px}
.chest .t b{font-family:var(--f-game);font-size:19px;font-weight:400}
.chest .t span{font-size:13px;color:var(--muted)}

/* navegação de dia */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.daynav button{width:38px;height:38px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:18px;font-weight:900}
.daynav button:disabled{opacity:.3}
.daynav .d{text-align:center}
.daynav .d b{font-family:var(--f-game);font-size:18px;font-weight:400;display:block}
.daynav .d span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.week div{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:800}
.week i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;background:var(--card);border:2px solid var(--line);color:var(--dim)}
.week i.done{background:var(--green);border-color:var(--green);color:#0b3a22}
.week i.part{background:rgba(255,154,60,.2);border-color:var(--orange);color:var(--orange)}
.week i.shield{background:rgba(60,220,247,.18);border-color:var(--cyan);color:var(--cyan)}
.week i.sel{outline:2px solid var(--yellow);outline-offset:2px}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs .in{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:440px;background:rgba(30,18,64,.92);backdrop-filter:blur(12px);border:2px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tabs button{display:grid;justify-items:center;gap:1px;padding:7px 2px;border-radius:18px;font-size:11px;font-weight:900;color:var(--dim);transition:background .2s,color .2s}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 4px 14px rgba(255,79,154,.45)}

/* folhas e telas cheias */
.sheet-bg{position:fixed;inset:0;background:rgba(8,3,20,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,#2B1D5A,#1E1442);border:2px solid var(--line);border-bottom:0;width:100%;max-width:520px;border-radius:28px 28px 0 0;max-height:90%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.sheet h2{font-size:24px}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:-4px}
input[type=text],input[type=number],select{width:100%;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#0d0620;color:var(--ink)}
input::placeholder{color:var(--dim)}
label.f{display:grid;gap:6px;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.03em}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border-radius:99px;padding:7px 12px;font-size:13px;font-weight:800;background:rgba(255,255,255,.07);border:2px solid var(--line)}
.verdict{border-radius:18px;padding:14px;display:grid;gap:6px;border:2px solid;animation:bub .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict.ok{background:rgba(61,227,141,.12);border-color:var(--green)}
.verdict.mod{background:rgba(255,154,60,.12);border-color:var(--orange)}
.verdict.no{background:rgba(255,100,100,.12);border-color:var(--red)}
.verdict.unk{background:rgba(255,255,255,.06);border-color:var(--line)}
.verdict b{font-family:var(--f-game);font-weight:400;font-size:22px}
.verdict.ok b{color:var(--green)} .verdict.mod b{color:var(--orange)} .verdict.no b{color:var(--red)}
.verdict p{margin:0;font-size:14px}
.verdict ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.ai-box{border:2px dashed var(--violet);border-radius:16px;padding:12px;display:grid;gap:6px;font-size:14px}
.ai-box .lbl{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.fs{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 30%,#3D2287,#130A26 70%);animation:fade .25s}
.fs .inner{display:grid;gap:14px;justify-items:center;text-align:center;max-width:380px;width:100%}
.fs h2{font-size:30px}
.fs p{margin:0;color:var(--muted)}
.timer{position:relative;width:240px;height:240px;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .c{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.timer .c b{font-family:var(--f-game);font-size:56px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.timer .c span{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.runner{width:110px;height:120px}
.runner svg{width:100%;height:100%}
.running .bob{animation:run .45s ease-in-out infinite}
@keyframes run{50%{transform:translateY(-8px)}}
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--cyan),rgba(60,220,247,.15) 70%);display:grid;place-items:center;font-family:var(--f-game);font-size:22px;color:#06303a;animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}

/* doces */
.sos{width:100%;border-radius:24px;padding:20px;text-align:left;background:linear-gradient(135deg,#FF4F9A,#9C6BFF);box-shadow:0 10px 30px rgba(255,79,154,.35),0 5px 0 #7d1f55;display:grid;gap:4px;position:relative;overflow:hidden}
.sos b{font-family:var(--f-game);font-weight:400;font-size:28px;line-height:1}
.sos span{font-size:14px;font-weight:700;opacity:.95}
.sos.won{background:linear-gradient(135deg,#1FB872,#3CDCF7);box-shadow:0 10px 30px rgba(61,227,141,.3),0 5px 0 #11734a}
.sweet{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sweet:last-child{border-bottom:0}
.sweet div{min-width:0}
.sweet b{font-weight:800}
.sweet small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.kcal{font-family:var(--f-game);font-weight:400;font-size:16px;white-space:nowrap;padding:4px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
.kcal.low{background:rgba(61,227,141,.15);color:var(--green)}
.kcal.mid{background:rgba(255,154,60,.15);color:var(--orange)}
.kcal.high{background:rgba(255,100,100,.15);color:var(--red)}
.tips{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.tips li::marker{font-family:var(--f-game);color:var(--yellow)}

/* evolução */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stages div{display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:900;color:var(--dim);text-align:center}
.stages div svg{width:52px;height:60px;filter:grayscale(1) brightness(.6)}
.stages div.on{color:var(--ink)}
.stages div.on svg{filter:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border-radius:16px;padding:10px;background:rgba(255,255,255,.05);border:2px solid var(--line);display:grid;gap:0}
.stats b{font-family:var(--f-game);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wardrobe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wardrobe button{aspect-ratio:1;max-width:100%;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;align-content:center;gap:2px;font-size:10px;font-weight:900;color:var(--muted);overflow:hidden;position:relative}
.wardrobe button svg{width:70%;height:auto}
.wardrobe button.on{border-color:var(--yellow);color:var(--ink);box-shadow:0 0 0 3px rgba(255,216,74,.25)}
.wardrobe button.locked{opacity:.4}
.wardrobe button .sw{width:60%;aspect-ratio:1;border-radius:10px}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.medal{display:grid;justify-items:center;gap:4px;text-align:center;font-size:10px;font-weight:900;color:var(--dim)}
.medal i{width:52px;height:52px;display:grid;place-items:center;font-style:normal;font-family:var(--f-game);font-size:16px;color:var(--dim);background:rgba(255,255,255,.05);border:2px dashed var(--line);border-radius:50%}
.medal.on{color:var(--ink)}
.medal.on i{border:3px solid #fff3;background:radial-gradient(circle at 35% 30%,#FFE98A,var(--yellow) 45%,#D99A12);color:#5a3d00;box-shadow:0 4px 0 #A8740A}
.chart{width:100%;height:auto;display:block}
.wlist{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:18px;line-height:1.5}
.tip{font-size:13px;color:var(--muted)}

/* onboarding */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.05);padding:8px 4px;display:grid;justify-items:center;gap:2px;font-family:var(--f-game);font-size:15px}
.pick button svg{width:76px;height:88px}
.pick button.on{border-color:var(--pink);background:rgba(255,79,154,.15)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.ob-scene{height:220px}
.ob-scene .av{left:50%}

/* feedback */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#fff;color:#2a1450;padding:10px 18px;border-radius:99px;font-weight:900;font-size:14px;z-index:40;max-width:90%;text-align:center;animation:bub .3s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.float{position:fixed;z-index:45;pointer-events:none;font-family:var(--f-game);font-size:26px;color:var(--yellow);text-shadow:0 3px 0 #7a4a00,0 0 18px rgba(255,216,74,.6);animation:flo 1.1s ease-out forwards}
@keyframes flo{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.reveal svg{width:150px;height:150px;animation:spinin .8s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spinin{from{transform:scale(0) rotate(-180deg)}}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,74,.45),transparent 65%);animation:pulse 2s infinite;z-index:-1}

/* cadastro */
.steps{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}

.steps i.on{background:var(--pink)}
.pick{grid-template-columns:repeat(4,1fr)!important}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;background:rgba(255,255,255,.06);border:2px solid var(--line);color:var(--ink);font-family:var(--f-body);letter-spacing:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daychips button{padding:9px 0;border-radius:10px;font-weight:900;font-size:12px;background:rgba(255,255,255,.06);border:2px solid var(--line);color:var(--muted)}

label.f.row{grid-template-columns:44px 1fr;align-items:center}
.modes{display:grid;gap:8px;margin-bottom:10px}

.modes button span{font-size:13px;color:var(--muted)}

textarea,input[type=time]{width:100%;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#0d0620;color:var(--ink);resize:vertical}
input[type=file]{width:100%;font:inherit;font-size:13px;color:var(--muted);padding:10px;border-radius:14px;border:2px dashed var(--line);background:#0d0620}
.mealedit{display:grid;gap:6px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:2px solid var(--line)}
.me-top{display:grid;grid-template-columns:108px 1fr auto;gap:6px;align-items:center}
.me-top input{padding:9px 10px}
.mealedit textarea{font-size:13px;padding:9px 10px}
.tgl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:800}
.tgl input{width:18px;height:18px;accent-color:var(--pink)}
.remind{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid var(--line);color:var(--ink);text-decoration:none}
.remind b{font-family:var(--f-game);font-weight:400;font-size:16px;color:var(--yellow);font-variant-numeric:tabular-nums}
.remind span{font-weight:800;min-width:0}
.remind i{font-style:normal;font-size:12px;font-weight:900;color:#06303a;background:var(--cyan);padding:5px 9px;border-radius:9px;white-space:nowrap}
.tgrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid var(--line)}
.tgrow span{display:grid;gap:2px;min-width:0}
.tgrow b{font-weight:900}
.tgrow small{font-size:12px;color:var(--muted);font-weight:700}
.tgrow .sw{flex:none;width:46px;height:28px;border-radius:99px;background:#0d0620;border:2px solid var(--line);position:relative;transition:background .2s}
.tgrow .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.tgrow .sw.on{background:var(--pink);border-color:var(--pink)}
.tgrow .sw.on::after{transform:translateX(18px);background:#fff}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
