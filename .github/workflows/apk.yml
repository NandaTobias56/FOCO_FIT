name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # mostra o motivo do erro no resumo do GitHub
            grep -E "What went wrong|error:|FAILURE|^> |Could not|e: " build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk foco-fit.apk
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Foco Fit 1.${{ github.run_number }}
          body: "Baixe o arquivo foco-fit.apk no celular e toque nele para instalar."
          files: foco-fit.apk
          make_latest: true
